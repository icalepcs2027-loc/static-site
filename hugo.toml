# Sponsors & Industry Partners
# Fields:
#   name     (required) Display name of the sponsor
#   logo     (required) Path to logo image under /static (e.g. /img/logo.png)
#   url      (required) Official website URL (opens in new tab)
#   tier     (optional) Sponsorship tier: "platinum" | "gold" | "silver" | "bronze" | "supporter"
#   tagline  (optional) Short one-line description shown on the sponsors sub-page
[[params.sponsors]]
name = "Quantum Dynamics Corp."
logo = "/img/ipac28_600x304.png"
url = "https://example.com/quantum-dynamics"
tier = "platinum"
tagline = "Pioneering the next generation of particle accelerator power systems."

[[params.sponsors]]
name = "NanoBeam Technologies"
logo = "/img/ipac28_600x304.png"
url = "https://example.com/nanobeam"
tier = "platinum"
tagline = "Precision beam diagnostics and control systems for modern accelerators."

[[params.sponsors]]
name = "FusionEdge Solutions"
logo = "/img/ipac28_600x304.png"
url = "https://example.com/fusionedge"
tier = "gold"
tagline = "Advanced RF and microwave components for high-energy physics research."

[[params.sponsors]]
name = "Acceleron Instruments"
logo = "/img/ipac28_600x304.png"
url = "https://example.com/acceleron"
tier = "gold"
tagline = "Vacuum technology and ultra-high vacuum solutions for research facilities."

[[params.sponsors]]
name = "Helios Superconductors"
logo = "/img/ipac28_600x304.png"
url = "https://example.com/helios-sc"
tier = "silver"
tagline = "Superconducting magnet systems and cryogenic infrastructure."

[[params.sponsors]]
name = "Synchrotron Systems Ltd."
logo = "/img/ipac28_600x304.png"
url = "https://example.com/synchrotron-sys"
tier = "silver"
tagline = "Turn-key synchrotron light source solutions worldwide."


# ============================================================================
# 1. サイトの基本設定 / Site Settings
# ============================================================================

baseURL = "https://test.icalepcs2027.org"
locale = "en-us"
title = "ICALEPCS2027 | The 21st International Conference on Accelerator and Large Experimental Physics Control Systems"

# ============================================================================
# 2. Markdownの描画設定 / Markdown Rendering
# ============================================================================
# unsafe: Markdown本文に含まれるHTMLを出力します。

[markup.goldmark.renderer]
unsafe = true

# ============================================================================
# 3. 大会情報とトップページ / Conference & Homepage
# ============================================================================
[params]

# ---------------------------------------------------------------------------
# ロゴ・ファビコン / Branding
# ---------------------------------------------------------------------------
# logo_image が指定されている場合は画像を使用します。
# logo_prefix / logo_suffix は文字ロゴ用です。
logo_prefix = "ICALEPCS"
logo_suffix = "2027"
logo_image = "/img/ICALEPCS2027_logo.png"
favicon = "/img/ICALEPCS2027_logo.png"

# ---------------------------------------------------------------------------
# 大会名・開催日時・連絡先 / Conference Details
# ---------------------------------------------------------------------------
# conf_start_date はカウントダウンの基準日時です（タイムゾーン付き）。
conf_short_name = "ICALEPCS 2027"
conf_full_name = "The 21st International Conference on Accelerator and Large Experimental Physics Control Systems"
conf_dates = "October 4-8, 2027"
conf_start_date = "2027-10-04T08:00:00+09:00"
conf_location = "Mito Civic Senter, Ibaraki, Japan"
email = "contact@icalepcs2027.org"
registration_link = "/register/register-conf/"

# ---------------------------------------------------------------------------
# トップページの画像・表示切り替え / Appearance & Toggles
# ---------------------------------------------------------------------------
# hero_image: 冒頭のポスター画像
# enable_*: 各セクションを表示する場合は true、非表示は false。
hero_badge = "The 21st International Conference on Accelerator and Large Experimental Physics Control Systems"
hero_image = "/img/ICALEPCS2027_Poster.png"
enable_countdown = true
# 統計表示（手動入力）：参加者数 / 発表件数 / 出展者数
enable_stats = false
stats.attendees = "1200+"
stats.presentations = "800+"
stats.exhibitors = "80+"

# ---------------------------------------------------------------------------
# 上部のお知らせバナー / Announcement Banner
# ---------------------------------------------------------------------------
enable_announcement = true
# announcement_text = "Abstract submission will open on Oct 1, 2027!"
# announcement_link = "/authors/authors-abstract/"
announcement_text = "Welcome to the ICALEPCS 2027 Website!"
announcement_link = "/about/about-welcome/"

# ---------------------------------------------------------------------------
# 日付の表示形式 / Date Format
# ---------------------------------------------------------------------------
# Goの基準日時の書式を使用します。日程そのものの設定ではありません。
date_fmt = "January 2, 2006"

# 日程データ: data/schedules/important_dates.yaml
# 委員会データ: data/committees/*.yaml

# ============================================================================
# 4. ニュース・更新情報 / News & Announcements
# ============================================================================
# トップページに日付の新しい順で最大3件を表示します。
# ニュースデータ: data/news.yaml

# ============================================================================
# 5. スポンサー / Sponsors & Industry Partners
# ============================================================================
# トップページへの表示は enable_sponsors で切り替えます。
# スポンサーデータ: data/sponsors.yaml
enable_sponsors = true

# ============================================================================
# 6. フォント・テーマカラー / Typography & Colors
# ============================================================================
# カラー設定はHugoのビルドで反映されます。
[params.text_style]
font_size = "0.95rem"
line_height = "1.65"
font_family = "Inter"
heading_font_family = "Montserrat"

# 本文・見出し・リンクとボタン・鮮やかなアクセント・ホバー・背景の色
body_color = "#3d5964"
heading_color = "#155e75"
link_color = "#007da6"
accent_color = "#00bfff"
primary_hover_color = "#006480"
dark_color = "#083344"
light_background_color = "#effbff"

# ============================================================================
# 7. SNSリンク / Social Links
# ============================================================================
# 使用する設定例のコメントを外し、URLを変更してください。
[params.social]
# twitter = "https://twitter.com/IPAC28"
# linkedin = "https://linkedin.com/company/ipac28"
# facebook = "https://facebook.com/ipac28"


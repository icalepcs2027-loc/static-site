# Questions and answers are displayed in file order. Answers support Markdown.
# Set hidden: true on an item or section to hide it.
intro: >-
  Find quick answers to common questions about abstract submission, registration, travel, and accommodation for ICALEPCS 2027.

sections:
  - title: "General & Abstracts"
    items:
      - question: "When and where will ICALEPCS 2027 take place?"
        answer: |
          ICALEPCS 2027 will be held from **October 4-8, 2027**, at the **Mito City Civic Center**, located in the Mito city, Ibaraki prefecture, Japan.
           <!-- Satellite meetings and registration check-ins will commence on Sunday, June 4, 2028. -->

      - question: "What is the deadline for abstract submission?"
        hidden: true
        answer: |
          The abstract submission deadline is **December 5, 2027, 23:59 JST (UTC+9)**. To submit an abstract, you must log in to the JACoW Indico platform. No late abstracts will be accepted.

      - question: "How many abstracts can I submit as a primary author?"
        hidden: true
        answer: |
          Usually, an individual is limited to submitting **one abstract as the primary presenter**. You may be listed as a co-author on multiple abstracts.

